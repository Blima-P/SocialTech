name: CI

on:
  pull_request:
    branches: [develop, main]
  # Na main, avisa quando uma edição do painel (Pages CMS) quebra o build ou um link.
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint e acessibilidade (ESLint)
        run: npm run lint

      - name: Tipos (astro check)
        run: npm run check

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1

      - name: Verificar site gerado
        run: npm run verificar:site && npm run test:verificador

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de comportamento
        run: npm run test:e2e

      - name: Anexar relatório dos testes
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "%7B" ignora URLs montadas em template no código (ex.: `https://wa.me/${numero}`),
      # que só existem depois do build. Os JSON de src/content/ trazem os links do painel.
      - name: Verificar links quebrados
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --accept "200..=299,403,429"
            --exclude "blima-p\.github\.io"
            --exclude "^mailto:"
            --exclude "%7B"
            --exclude-path node_modules
            --exclude-path dist
            "./**/*.md" "./src/**/*.astro" "./src/content/**/*.json"
